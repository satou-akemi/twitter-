services:
    nginx:
        image: nginx:1.21.1
        ports:
            - "80:80"
        volumes:
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
            - ./src:/var/www/
        depends_on:
            - php #サービス同士の依存関係

    php:
        build: ./docker/php
        volumes:
            - ./src:/var/www/

    mysql: #-(ハイフン)不可
        image: mysql:8.0.26
        environment:
            MYSQL_ROOT_PASSWORD: root #rootユーザのパスワード
            MYSQL_DATABASE: twitter_db #プロジェクトファイルの名前
            MYSQL_USER: twitter_user #ユーザ名
            MYSQL_PASSWORD: twitter_pass #ユーザのパスワード
        command:
            mysqld --default-authentication-plugin=mysql_native_password
        volumes:
            - ./docker/mysql/data:/var/lib/mysql
            - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf

    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        environment:
            - PMA_ARBITRARY=1
            - PMA_HOST=mysql
            - PMA_USER=twitter_user #プロジェクトファイルの名前
            - PMA_PASSWORD=twitter_pass #プロジェクトのpw
        depends_on:
            - mysql
        ports:
            - 8080:80  #MyAdminのポート番号

    mailhog: #メール認証が必要な場合
        image: mailhog/mailhog
        ports:
            - "1025:1025"
            - "8025:8025"